syntax = "proto3";

package protokt.v1.codegen.testing;

message Request {}

message Response {}

service NamingService {
  rpc GetURL(Request) returns (Response);
  rpc X(Request) returns (Response);
  rpc OrdinaryName(Request) returns (Response);
}
