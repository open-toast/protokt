syntax = "proto3";

package protokt.v1.testing.aliases;
option java_package = "protokt.v1.testing.aliases.java";

enum Choice {
  option allow_alias = true;
  PRIMARY = 0;
  ALIAS = 0;
  OTHER = 1;
  OTHER_ALIAS = 1;
}

message AliasMessage {
  Choice choice = 1;
  repeated Choice choices = 2;
  map<string, Choice> choices_by_name = 3;
}

enum ObjectFirstChoice {
  option allow_alias = true;
  OBJECT_FIRST_CHOICE_PRIMARY = 0;
  OBJECT_FIRST_CHOICE_ALIAS = 0;
}
