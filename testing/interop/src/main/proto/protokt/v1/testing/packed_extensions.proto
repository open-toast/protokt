syntax = "proto2";

package protokt.v1.testing;

option java_package = "com.toasttab.protokt.v1.testing";

message PackedExtensionContainer {
  extensions 100 to max;
}

enum PackedExtensionEnum {
  ZERO = 0;
  ONE = 1;
  TWO = 2;
}

extend PackedExtensionContainer {
  repeated int32 packed_int32_extension = 100 [packed = true];
  repeated PackedExtensionEnum packed_enum_extension = 101 [packed = true];
  repeated fixed32 unpacked_fixed32_extension = 102 [packed = false];
}
